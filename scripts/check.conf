# scripts/check.conf — Polsan Leave Manager (.NET 10 + Blazor + SQLite).
# Format: <name>: <command>, runs in order, fails fast. [fast] in the NAME = also in --fast.
# Every command must leave nothing running (docs/testing.md, Resource hygiene).
# Activated by plan 0001 (app skeleton). Rerun ./scripts/residue and ./scripts/residue --fast
# whenever this file changes.
#
# Resource hygiene inventory (what each command could leave behind → neutralizer):
#   dotnet restore/build/test → MSBuild worker nodes (node reuse), VBCSCompiler (Roslyn server),
#     Razor build server, MSBuild server  → --disable-build-servers + -p:UseSharedCompilation=false
#   dotnet format, dotnet list package → MSBuild worker nodes (/nodeReuse:true) →
#     MSBUILDDISABLENODEREUSE=1, DOTNET_CLI_USE_MSBUILD_SERVER=0 (verified: plain `dotnet list` left 15 nodes)
#   dotnet test → testhost processes (exit with the run); E2E: Kestrel app + Chromium + Playwright
#     driver → owned and disposed by AppFixture (docs/testing.md), headless, one fixture
#   SQLite → in-process (no server); integration tests delete their temp database files
#
# Test split by SELECTOR (docs/testing.md rule 4): fast = Category!=Integration&Category!=E2E,
# full-only = the exact inverse, so every test runs in exactly one of them.
#
# resource hygiene: no build servers (MSBuild nodes, VBCSCompiler, Razor, MSBuild server)
restore [fast]: dotnet restore Polsan.Leave.slnx --disable-build-servers
build [fast]: dotnet build Polsan.Leave.slnx --no-restore --disable-build-servers -p:UseSharedCompilation=false
# resource hygiene: no MSBuild node reuse in format's workspace
format [fast]: MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0 dotnet format Polsan.Leave.slnx --verify-no-changes --no-restore
test-unit [fast]: dotnet test Polsan.Leave.slnx --no-build --disable-build-servers --filter "Category!=Integration&Category!=E2E"
# Needs the one-time Playwright Chromium install (docs/testing.md); missing → red, never skipped.
test-integration-e2e: dotnet test Polsan.Leave.slnx --no-build --disable-build-servers --filter "Category=Integration|Category=E2E"
# list --vulnerable exits 0 even when it finds something, so its output is inspected (needs network).
# JSON, not text: the text output is localized (e.g. Turkish) and an English grep would never match.
# Any "problems" entry (e.g. the vulnerability data could not be fetched) is red too: an
# unanswered question is not a "no" (review 0001, M1).
# resource hygiene: no MSBuild node reuse — without it `dotnet list` leaves ~15 worker nodes running
vulnerable-packages: sh -c 'out=$(MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0 dotnet list Polsan.Leave.slnx package --vulnerable --include-transitive --format json) || exit 1; if echo "$out" | grep -q -e "\"vulnerabilities\"" -e "\"problems\""; then echo "$out"; echo "vulnerable packages found or vulnerability data incomplete" >&2; exit 1; fi; echo "no vulnerable packages"'
